# ─────────────────────────────────────────────────────────────────
#  ICT Silver Bullet Automated Trading Bot  v5.3
#  Strategy: SMC 30U 紐約盤保守版
# ─────────────────────────────────────────────────────────────────

trading:
  symbol: "BTC/USDT:USDT"
  smt_symbol: "ETH/USDT:USDT"
  leverage: 1
  capital_usdt: 30.0
  risk_per_trade: 0.01            # 1% risk = 0.30 USDT
  stop_loss_pct: 0.01             # 1.0% SL
  take_profit_pct: 0.025          # 2.5% TP → 真實盈虧比 ≈ 2.28:1
  maker_fee: 0.0002
  taker_fee: 0.0005
  min_rr_ratio: 2.5               # 盈虧比 < 2.5 不進場

# ── 交易時段（台灣時間 UTC+8）────────────────────────────────────
sessions:
  pre_market:                     # 層次1：盤前準備（只觀察）
    start: "20:00"
    end: "20:30"

  mid_session:                    # 層次2：盤中觀察（只觀察）
    start: "20:30"
    end: "22:00"

  silver_bullet:                  # ICT Silver Bullet = 紐約 10:00–11:00（程式用 NY 時區判斷）
    start: "22:00"                # 夏令（EDT UTC-4）：台灣 22:00–23:00
    end: "23:00"                  # 冬令（EST UTC-5）：台灣 23:00–00:00

  no_new_entry_after: "02:00"     # 02:00 後不開新倉（安全閥）
  force_close: "04:00"            # 強制平倉所有倉位（對應紐約 16:00 EDT / 15:00 EST）
  timezone: "Asia/Taipei"

# ── 5.1 HTF Bias ─────────────────────────────────────────────────
htf_bias:
  timeframe_4h: "4h"
  timeframe_daily: "1d"
  lookback: 50
  ma_periods: [7, 14, 28]
  min_consecutive_candles: 2

# ── 5.2 Premium / Discount ───────────────────────────────────────
premium_discount:
  lookback_candles: 50
  strong_zone_pct: 0.05

# ── 5.3 MTF POI 4× Resonance ─────────────────────────────────────
signals:
  htf_timeframe: "1h"
  ltf_timeframe: "5m"
  lookback_candles: 100
  a_grade_resonances: 4           # A = 四重共振全滿足
  b_grade_resonances: 3           # B = 三重（跳過）
  ob:
    min_impulse_pct: 0.003
    max_ob_age_candles: 50
  fvg:
    min_gap_pct: 0.001
  ote:
    fib_level: 0.705
    fib_low: 0.618
    fib_high: 0.79
  volume_profile:
    bins: 50
    value_area_pct: 0.70

# ── 5.4 Liquidity ────────────────────────────────────────────────
liquidity:
  lookback_candles: 30
  equal_level_tolerance_pct: 0.001
  sweep_return_candles: 3

# ── 5.5 LTF Triggers（需 ≥2 個）─────────────────────────────────
ltf_triggers:
  min_triggers_required: 2
  ltf_fvg_min_gap_pct: 0.0005

# ── 5.7 News & SMT ───────────────────────────────────────────────
news:
  block_window_hours: 4
  events_file: "data/news_events.json"

smt:
  enabled: true
  lookback_candles: 10

# ── 風控與資金管理（8.x）─────────────────────────────────────────
risk:
  max_trades_per_day: 1           # 每日最多 1 筆
  stop_after_daily_loss: 1        # 1 筆虧損當晚停手
  consecutive_loss_days_limit: 2  # 連續 2 晚虧損 → 停手 3 天
  consecutive_loss_pause_days: 3
  hard_loss_days_limit: 3         # 連續 3 晚虧損 → 停手 7 天
  hard_loss_pause_days: 7
  monthly_profit_target_pct: 0.10 # +10% 當月停手

  # 8.2 資金預警系統（自動停手）
  drawdown_levels:
    yellow_usdt: 21.0             # -30% → 停手 24H
    yellow_pause_hours: 24
    orange_usdt: 15.0             # -50% → 停手 3 天
    orange_pause_days: 3
    red_usdt: 9.0                 # -70% → 停手 7 天
    red_pause_days: 7

  survival_mode:
    enabled: false
    capital_threshold_usdt: 21.0

# ── 狀態 & Log ────────────────────────────────────────────────────
state:
  file: "data/bot_state.json"

logging:
  level: "INFO"
  file: "data/trading_bot.log"
  max_bytes: 10485760
  backup_count: 5
